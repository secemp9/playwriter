<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offers · Browser Lab</title>
<link rel="icon" href="data:,">
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 24px; }
  .banner { height: 120px; background: #fff4d6; display: flex; align-items: center; padding: 0 18px; }
</style>
</head>
<body>
<h1>Offers</h1>
<div id="slot"></div>
<ul id="list"><li>First offer</li><li>Second offer</li></ul>
<button type="button" id="load">Load offers</button>
<p id="status" role="status">Offers not loaded</p>
<p id="printed"></p>
<script>
  // The banner arrives with the server's answer (900 ms after the click: later than the 500 ms in which
  // Chrome counts a shift as the input's own), pushing everything below it down: a layout shift.
  document.getElementById('load').addEventListener('click', async () => {
    document.getElementById('status').textContent = 'Loading offers'
    await fetch('/slow-offers')
    const banner = document.createElement('div')
    banner.className = 'banner'
    banner.textContent = 'Limited offer: free shipping this week only!'
    document.getElementById('slot').append(banner)
    document.getElementById('status').textContent = 'Offers loaded'
  })
  // Print handlers: what a page may do when it is printed (pdf() must say the page saw it).
  window.addEventListener('afterprint', () => {
    document.getElementById('printed').textContent = 'This page was printed'
  })
</script>
</body>
</html>
